<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Dead Flag Captain</title>
    <link rel="icon" href="/images/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/loading.css" class="" />
  </head>
  <body>
    <div class="grid-bg"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="loader">
      <!-- Background logo -->
      <div class="logo-bg">
        <img src="images/logo.png" alt="logo" />
      </div>

      <div class="icons-row">
        <!-- Code icon -->
        <div class="icon-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
          </svg>
        </div>

        <!-- Person icon -->
        <div class="icon-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>

        <!-- Computer icon -->
        <div class="icon-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="white"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="12" y1="17" x2="12" y2="21" />
          </svg>
        </div>
      </div>

      <div class="line"></div>

      <div class="welcome">
        <p>Welcome to my website</p>
        <h1>Jotham Den M. Baquiran</h1>
        <p>BSIT STUDENT</p>
      </div>

      <div class="btn-wrap">
        <button id="enter-btn"><span id="btn-text"></span></button>
      </div>
    </div>

    <script src="scripts/loading.js"></script>
  </body>
</html>
